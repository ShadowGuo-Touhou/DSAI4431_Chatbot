# =====================================================================
#  UI text · English (en)
#
#  Keys are dotted paths: `api_key` under `[settings.nav]` is read with
#  `t("settings.nav.api_key")`. Adding a string means adding one line to
#  every language file.
#
#  `{...}` placeholders are filled by t(key, name=value) — keep that syntax.
#  A key missing here falls back to Chinese (zh), so a gap shows Chinese
#  rather than a blank label.
# =====================================================================

[meta]
code = "en"
name = "English"

[app]
title = "DSAI4431 Chatbot"

# Shown when the single-instance check fails (see main_window.acquire_single_instance)
[app.already_running]
title = "Already running"
body = "This app is already open.\n\nA second window would fight over the same Ollama service and knowledge index, so it was not started.\n\nSwitch to the window that is already open."

