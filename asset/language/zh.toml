# =====================================================================
#  界面文案 · 中文（zh）
#
#  键名就是点分路径：`[settings.nav]` 下的 `api_key` 对应
#  `t("settings.nav.api_key")`。加一条文案 = 每个语言包里各加一行。
#
#  `{...}` 是占位符，由 t(key, name=value) 填充，不要改成别的写法。
#  这个文件缺的键会回退到自身（zh 就是回退语言），所以 en 里缺一条
#  会显示中文而不是空白。
# =====================================================================

[meta]
code = "zh"
name = "中文"

[app]
title = "DSAI4431 Chatbot"

# --- 主窗口 ---------------------------------------------------------
[main.character]
placeholder = "Live2D 角色区\n（框架占位，待接入渲染页）"
error = "Live2D 未加载：{msg}"

[main.messages]
empty = "还没有消息"
thinking = "正在输入…"
no_key = "还没填 API Key。打开 设置 → API KEY 填好，再回来发消息。"
failed = "请求失败：{msg}"
empty_reply = "（模型没有返回内容）"

# --- 会话（≡ 打开的抽屉） --------------------------------------------
[session]
title = "会话"
new = "＋ 新建对话"
cancel_new = "取消新建"
persona = "人格"
model = "模型"
create = "创建"
cancel = "取消"
empty = "还没有对话"
close = "关闭（Esc）"
untitled = "（未命名对话）"

[main.input]
placeholder = "说点什么…（Enter 发送，Shift+Enter 换行）"

[main.button]
menu = "会话列表"
settings = "设置"
attach = "添加附件（占位）"
voice = "语音输入（占位）"
send = "发送"

# --- 通用 -----------------------------------------------------------
[common]
browse = "浏览（占位）"
choose = "选择"
edit = "编辑"
chars = "{n} 字符"

# --- 设置窗口 -------------------------------------------------------
[settings]
title = "设置"
close = "关闭（Esc）"

[settings.nav]
api_key = "API KEY"
personality = "Personality"
rag = "RAG"
live2d = "Live2D model"
theme = "Theme"
other = "Other"

[settings.api_key]
title = "API Key"
api = "API"
api_placeholder = "例：https://api.deepseek.com"
token = "Token"
token_placeholder = "粘贴你的 API Token"
model = "模型"
model_placeholder = "默认 deepseek-chat（可换 deepseek-reasoner）"
key_hint = '改完就自动保存，没有「保存」按钮。Key 以明文存在本机 settings.ini 里（不会上传到别处），但别把这份配置发给别人。'

[settings.personality]
title = "人格编辑"
list = "Persona 列表"
list_default = "大肥鱼（默认）"
list_test = "测试人格"
new_button = "+ 新建"
new_title = "New Persona"
id = "ID"
id_placeholder = "persona_id"
name = "NAME"
name_placeholder = "显示名称"
files = "Persona Files"
files_placeholder = "人格文件所在目录"
file_list = "FileList"
preview = "Preview"
save = "Save"
rescan = "重新扫描"
dir_ok = "目录可用：勾选的文件会拼成 system 提示词"
dir_missing = "目录不存在：{path}（下面的清单是演示数据）"
preview_empty = "（没有内容可发：一个文件都没勾，或者文件读不出来）"

[settings.rag]
title = "Retrieval-Augmented Generation"
ollama = "Ollama"
ollama_placeholder = "Ollama 可执行文件或服务地址"
embedding = "Embedding"
embedding_placeholder = "Embedding 模型目录"
folder = "Folder"
folder_placeholder = "知识库目录"
file_list = "FileList"
file_empty = "（还没有索引文件）"
rebuild = "Full rebuild"
status = "索引状态：未构建"
