new = "＋ 新建对话"
persona = "人格"
model = "模型"
empty = "还没有对话"
close = "关闭（Esc）"
untitled = "（未命名对话）"
rename = "重命名"
delete = "删除"
rename_title = "重命名对话"
delete_title = "删除对话"
delete_ask = "确定删除「{name}」？文件会一起删掉，不能恢复。"
delete_many_ask = "确定删除选中的 {n} 个对话？文件会一起删掉，不能恢复。"
select = "选择"
select_done = "完成"
select_all = "全选"
select_none = "取消全选"
delete_selected = "删除选中（{n}）"

[main.input]
placeholder = "说点什么…（Enter 发送，Shift+Enter 换行）"

[main.button]
menu = "会话列表"
settings = "设置"
attach = "添加附件（占位）"
voice = "语音输入（占位）"
send = "发送"

