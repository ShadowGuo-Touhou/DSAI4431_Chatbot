# =====================================================================
#  界面文案 · 中文（zh）
#
#  键名就是点分路径：`[settings.nav]` 下的 `api_key` 对应
#  `t("settings.nav.api_key")`。加一条文案 = 每个语言包里各加一行。
#
#  `{...}` 是占位符，由 t(key, name=value) 填充，不要改成别的写法。
#  这个文件缺的键会回退到自身（zh 就是回退语言），所以 en 里缺一条
#  会显示中文而不是空白。
# =====================================================================

[meta]
code = "zh"
name = "中文"

[app]
title = "DSAI4431 Chatbot"

# --- 主窗口 ---------------------------------------------------------
[main.character]
placeholder = "Live2D 角色区\n（框架占位，待接入渲染页）"
error = "Live2D 未加载：{msg}"

[main.messages]
empty = "还没有消息"
thinking = "正在输入…"
no_key = "还没填 API Key。打开 设置 → API KEY 填好，再回来发消息。"
failed = "请求失败：{msg}"
empty_reply = "（模型没有返回内容）"

# --- 新对话页（右侧聊天列里的空白首页） -------------------------------
[main.home]
title = "开始新的对话"
placeholder = "说点什么开始…（Enter 发送，Shift+Enter 换行）"

# --- 会话（≡ 打开的抽屉） --------------------------------------------
[session]
