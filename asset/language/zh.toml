# =====================================================================
#  界面文案 · 中文（zh）
#
#  键名就是点分路径：`[settings.nav]` 下的 `api_key` 对应
#  `t("settings.nav.api_key")`。加一条文案 = 每个语言包里各加一行。
#
#  `{...}` 是占位符，由 t(key, name=value) 填充，不要改成别的写法。
#  这个文件缺的键会回退到自身（zh 就是回退语言），所以 en 里缺一条
#  会显示中文而不是空白。
# =====================================================================

[meta]
code = "zh"
name = "中文"

[app]
title = "DSAI4431 Chatbot"

# 单实例检查失败时弹的框（见 main_window.acquire_single_instance）
[app.already_running]
title = "程序已经在运行"
body = "已经打开了一个窗口。\n\n再开一份会让两个窗口抢同一份 Ollama 服务和知识库索引，所以这次不启动。\n\n请切到已经打开的那个窗口。"

