[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsai4431-chatbot"
version = "0.1.0"
description = "DSAI4431 Chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Live2D 桌面演示（core/live2d）用得到；核心包本身不依赖 Qt。
# 安装：pip install -e ".[live2d]"
# 国内建议加镜像：-i https://pypi.tuna.tsinghua.edu.cn/simple
live2d = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
]

# 主界面 GUI（core/gui）用 PySide6（Qt6）。和上面 live2d 的 PyQt5 是两套
# 独立的 Qt 绑定，别混装到同一个 import 里。
# PySide6 元包同时带 Essentials + Addons，QtWebEngineWidgets 在 Addons 里，
# 后面把 Live2D 嵌进界面时直接 import PySide6.QtWebEngineWidgets 即可。
#
# numpy / sherpa-onnx 是语音输入（core/gui/voice_input.py）要的：
# - numpy：顶层就用（录音缓冲转 float32）
# - sherpa-onnx：模型推理，Windows 轮子自带 onnxruntime，纯 CPU，不需要 torch
# 安装：pip install -e ".[gui]"
gui = [
    # 钉死版本：写成 >=6.12 时 pip 的 resolver 会试遍所有 PySide6 版本，
    # 实测卡了 6 分钟零产出；钉成 ==6.12.0 后 90 秒装完。
    "PySide6==6.12.0",
    "numpy>=1.26",
    "sherpa-onnx>=1.13",
]

# 本地知识库检索（core/rag）：只多一个 numpy（向量存成 .npz）。
# 真正的 embedding 由 Ollama 通过 HTTP 提供，不是 Python 依赖。
# 安装：pip install -e ".[rag]"
rag = [
    "numpy>=1.26",
]

[project.scripts]
dsai4431-chatbot = "dsai4431_chatbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.svg", "*.toml"]
