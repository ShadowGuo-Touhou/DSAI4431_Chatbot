[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsai4431-chatbot"
version = "0.1.0"
description = "DSAI4431 Chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Live2D 桌面演示（core/live2d）用得到；核心包本身不依赖 Qt。
# 安装：pip install -e ".[live2d]"
# 国内建议加镜像：-i https://pypi.tuna.tsinghua.edu.cn/simple
live2d = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
]

[project.scripts]
dsai4431-chatbot = "dsai4431_chatbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
