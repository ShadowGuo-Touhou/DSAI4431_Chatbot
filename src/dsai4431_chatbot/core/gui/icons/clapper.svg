<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#1f2329" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- 板身：整体顺时针歪 5°，以左上角为支点（纯 2D 旋转，不做透视） -->
  <g transform="rotate(5 4.2 10.1)">
    <rect x="4.2" y="10.1" width="16.4" height="9" rx="1.5"/>
    <!-- 板身分格（PROD / SCENE / TAKE） -->
    <path d="M4.2 14.1h16.4"/>
    <path d="M10.2 14.1v5M14.9 14.1v5"/>
  </g>
  <!-- 打板条：单线条，不再画厚度 -->
  <path d="M4.3 10.0 20.2 6.5" stroke-width="2.2"/>
</svg>
