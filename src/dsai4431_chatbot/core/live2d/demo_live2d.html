<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Live2D demo (Cubism Web)</title>
<style>
  html, body { margin:0; height:100%; background:#12161b; overflow:hidden; }
  #c { display:block; width:100%; height:100%; }
  #err {
    position:fixed; left:12px; top:12px; right:12px; color:#ff9b9b;
    font:13px/1.6 Consolas, "Cascadia Mono", monospace; white-space:pre-wrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>

<!-- 顺序不能动：Core → PIXI → pixi-live2d-display 的 cubism4 包 -->
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/cubism4.min.js"></script>

<script type="module">
window.__l2dErrors = [];
window.addEventListener('error', function (ev) {
  var stack = (ev.error && ev.error.stack) ? String(ev.error.stack).slice(0, 1500) : '';
  window.__l2dErrors.push(ev.message + ' @ ' + (ev.filename || '?') + ':' + (ev.lineno || 0) + '\n' + stack);
  console.error('[captured]', ev.message, stack);
});

const errEl = document.getElementById('err');
function fail(m) {
  errEl.textContent = String(m);
  window.l2dError = String(m);
  console.error(m);
}

// QtWebEngine 5.15 内核是 Chromium 83，**不支持顶层 await**（Chrome 89 才有）。
// 所以整段必须包进 async IIFE，否则会报 "Uncaught SyntaxError: Unexpected reserved word" 整页作废。
(async () => {
try {
  if (!window.Live2DCubismCore?.Moc)
    throw new Error('缺少 vendor/live2dcubismcore.min.js\n从 https://www.live2d.com/en/sdk/download/web/ 下 Cubism SDK for Web，取出 Core 改名后放进 vendor/');
  if (!window.PIXI?.Application) throw new Error('缺少 vendor/pixi.min.js');
  if (!window.PIXI.live2d?.Live2DModel) throw new Error('缺少 vendor/cubism4.min.js');

  const qs = new URLSearchParams(location.search);
  const modelName = qs.get('m');
  if (!modelName) throw new Error('URL 缺少 ?m=xxx.model3.json 参数');

  const app = new PIXI.Application({
    view: document.getElementById('c'),
    backgroundAlpha: 0,
    antialias: true,
    autoDensity: true,
    resolution: Math.min(devicePixelRatio || 1, 2),
    resizeTo: window,
  });
  PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);

  const model = await PIXI.live2d.Live2DModel.from('/model/' + modelName, { autoInteract: false });
  app.stage.addChild(model);

  const im = model.internalModel;
  const mm = im.motionManager || null;

  // -------------------------------------------------------------------------
  // Cubism Core 6 兼容垫片（关键！）
  //
  // Cubism SDK for Web 5-r.5 自带的 Core 是 6.x，它把每个 drawable 的渲染顺序
  // 从 drawables.renderOrders 改名成了 drawables.drawOrders（数据本身没变，
  // 仍是 Int32Array，长度 = drawableCount）。
  //
  // 而 pixi-live2d-display 0.4.0 的 renderer 是：
  //     getDrawableRenderOrders() { return this._model.drawables.renderOrders }
  // 于是拿到 undefined，下一行 e[0] 就抛
  //     TypeError: Cannot read property '0' of undefined
  // 而这是每帧渲染里抛的 —— 页面不白等，画面则一帧都画不出来（全白）。
  //
  // 补一个别名即可，物理/表情/动作全都不受影响。
  // -------------------------------------------------------------------------
  try {
    const rawModel = im.coreModel && im.coreModel._model;
    if (rawModel && rawModel.drawables) {
      const d = rawModel.drawables;
      if (d.renderOrders === undefined) {
        // Core 6 把这条数据挪走了。优先用 Model.getRenderOrders()（正确的 0..N-1 排列），
        // 退而求其次才用 drawables.drawOrders。
        let ro = null;
        try { ro = rawModel.getRenderOrders && rawModel.getRenderOrders(); } catch (_) {}
        if (!ro || !ro.length) ro = d.drawOrders;
        if (ro) {
          d.renderOrders = ro;
          window.__l2dCompat = 'core6: renderOrders restored, len=' + ro.length;
          console.warn('[compat] Core 6：已恢复 drawables.renderOrders，长度', ro.length);
        }
      } else {
        window.__l2dCompat = 'core4/5: native renderOrders';
      }
    }
  } catch (e) {
    console.warn('[compat] 垫片执行失败（不影响其他功能）:', e && e.message);
  }


  // -------------------------------------------------------------------------
  // 画黑层修正
  //
  // 有些模型的「表情切换层」（比如黑脸、换装覆盖）是靠 multiplyColor=(0,0,0)
  // 把贴图乘成纯黑来实现的，配套的 Part 里同时还有正常颜色的部件。
  // VTS 会按 pose / 表情把它们藏起来；这类模型没有 pose3.json，于是黑层直接
  // 画在脸上，变成一个纯黑方块。
  //
  // ⚠ 别整个 Part 一起隐藏 —— 那会把同 Part 里的正常部件（本例是鼻子）也删掉。
  //   必须精确到具体 drawable。
  //
  // 大肥鱼实测：Part46 有 5 个 drawable
  //   #513 #514  mul=(0,0,0)  ← 黑脸覆盖层，要藏
  //   #515 #516 #517 mul=(1,1,1) ← 正常的鼻子，保留
  //
  // 定位方法：遍历 drawables.multiplyColors，找值为 (0,0,0) 的；
  // 再核对它们和正常部件的 parentPartIndices 是否相同。
  // -------------------------------------------------------------------------
  const HIDDEN_DRAWABLES_BY_MODEL = {
    '大肥鱼': [513, 514],
  };

  // -------------------------------------------------------------------------
  // 反应动作系统
  //
  // 模型自带的 motion3 全是换装 / 手势（举手、竖手指、狗尾草、脱捕），没有
  // 「被点一下」「被摸头」这类交互反馈。所以这里用参数时间轴自己编排，
  // 不依赖模型资源，换任何 Cubism 4 模型都能用。
  //
  // 原理：在 Core 的 update 之前写入参数，Core 这一帧就按新值重算。
  // 用到的都是 Cubism 标准参数，模型没有的会自动跳过（setParameterValueById
  // 不存在该参数时抛错，包在 try 里）。
  //
  // 对外接口：window.l2d.react('tap' | 'headpat')，返回 true 表示已触发。
  // -------------------------------------------------------------------------
  const REACTIONS = {
    // 被点一下：瞬间闭紧眼 + 歪头 + 眉心皱一下
    tap: {
      duration: 1050,
      tracks: {
        ParamEyeLOpen: [[0, 1], [110, 0], [430, 0], [720, 1], [1050, 1]],
        ParamEyeROpen: [[0, 1], [110, 0], [430, 0], [720, 1], [1050, 1]],
        ParamAngleZ:   [[0, 0], [150, 13], [520, 8], [1050, 0]],
        ParamAngleY:   [[0, 0], [150, -5], [600, -2], [1050, 0]],
        ParamAngleX:   [[0, 0], [150, 4], [600, 1], [1050, 0]],
        ParamBrowLY:   [[0, 0], [150, -0.35], [600, -0.1], [1050, 0]],
        ParamBrowRY:   [[0, 0], [150, -0.35], [600, -0.1], [1050, 0]],
      },
    },

    // 被摸头：> < 眼睛 + 小张嘴 + 头微低偏一点 + 脸红
    //
    // ★ 眼睛的 >< 不是参数组合出来的，是这个模型自带的表达式「＞＜」：
    //     Exp3/＞＜.exp3.json 里只做一件事 —— 把 key5 加到 1.0。
    //   所以直接写 key5=1 就行，比调 EyeSmile 准得多。
    //   嘴按需求只要"小张"：MouthOpenY 微开 + MouthForm 轻微上扬。
    headpat: {
      duration: 1950,
      tracks: {
        key5:            [[0, 0], [200, 1], [1450, 1], [1950, 0]],
        ParamMouthOpenY: [[0, 0], [240, 0.35], [1450, 0.3], [1950, 0]],
        ParamMouthForm:  [[0, 0], [240, 0.5], [1450, 0.5], [1950, 0]],
        ParamAngleY:     [[0, 0], [260, 7], [1450, 5], [1950, 0]],
        ParamAngleZ:     [[0, 0], [300, 8], [950, 3], [1950, 0]],
        ParamAngleX:     [[0, 0], [300, -3], [950, -2], [1950, 0]],
        ParamBodyAngleZ: [[0, 0], [300, 3], [1450, 2], [1950, 0]],
        ParamCheek:      [[0, 0], [300, 0.7], [1450, 0.6], [1950, 0]],
      },
    },

    // 摸头（循环版）：像 GIF 一样不停循环，直到调用 stopReaction()
    // 首尾值必须相等，否则循环接缝会跳一下。
    headpatLoop: {
      duration: 2200,
      loop: true,
      tracks: {
        key5:            [[0, 1], [2200, 1]],
        ParamMouthOpenY: [[0, 0.3], [2200, 0.3]],
        ParamMouthForm:  [[0, 0.5], [2200, 0.5]],
        ParamCheek:      [[0, 0.65], [2200, 0.65]],
        // 头像是被一下一下顺着，左右轻轻晃
        ParamAngleZ:     [[0, 5], [550, 10], [1100, 4], [1650, 10], [2200, 5]],
        ParamAngleX:     [[0, -2], [550, 3], [1100, -2], [1650, 3], [2200, -2]],
        ParamAngleY:     [[0, 6], [1100, 3], [2200, 6]],
        ParamBodyAngleZ: [[0, 3], [1100, 1], [2200, 3]],
      },
    },
  };

  let _rx = null;                    // 正在播放的反应：{ def, start }
  let _blinkBefore = '__none__';     // 反应前保存的自动眨眼实例
  let _physicsBefore = '__none__';   // 反应前保存的物理实例
  let _resumeMotion = null;          // 反应结束后要接回的动作组名

  // 鼠标跟随状态（-1 ~ 1 的归一化坐标）
  let _aimX = 0, _aimY = 0;          // 鼠标目标
  let _curX = 0, _curY = 0;          // 平滑后的实际值
  let _physSaved = null;             // 跟随期间被摘掉的物理实例
  let _physSuspended = false;
  let _physWanted = true;            // 宿主设置里「物理」这一项是开还是关

  function _ease(k) { return k * k * (3 - 2 * k); }   // smoothstep

  function _sample(keys, t) {
    if (!keys || !keys.length) return 0;
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const t0 = keys[i - 1][0], v0 = keys[i - 1][1];
        const t1 = keys[i][0],     v1 = keys[i][1];
        return v0 + (v1 - v0) * _ease((t - t0) / Math.max(1, t1 - t0));
      }
    }
    return keys[keys.length - 1][1];
  }

  // 鼠标跟随：整个头 + 眼珠 + 身体一起转，不只是眼珠。
  // 必须在 im.update 进入前写（Core 会在 update 内部重置 beforeModelUpdate 里写的东西）。
  //
  // ★ 这个模型的物理会把头部角度"锁死"：物理开着时 ParamAngleX 从 -24 扫到 +30，
  //   头部画面纹丝不动；物理一关立刻正常转。所以跟随期间临时摘掉物理。
  //   代价是头发/裙摆的晃动暂停 —— 跟着鼠标转头比物理晃动重要。
  function _tickFollow() {
    if (!followOn) {
      if (_physSuspended) {
        // 关掉跟随时把物理还回去 —— 但只在宿主本来就开着物理时才还
        try { im.physics = _physWanted ? _physSaved : null; } catch (_) {}
        _physSaved = null;
        _physSuspended = false;
      }
      return;
    }

    if (!_physSuspended && im.physics) {
      _physSaved = im.physics;
      try { im.physics = null; } catch (_) {}
      _physSuspended = true;
    }
    // 阻尼趋近，避免鼠标一动模型就抽搐
    _curX += (_aimX - _curX) * 0.13;
    _curY += (_aimY - _curY) * 0.13;

    const cm = im.coreModel;
    try { cm.setParameterValueById('ParamAngleX', _curX * 30); } catch (_) {}
    try { cm.setParameterValueById('ParamAngleY', -_curY * 30); } catch (_) {}
    try { cm.setParameterValueById('ParamEyeBallX', _curX); } catch (_) {}
    try { cm.setParameterValueById('ParamEyeBallY', -_curY); } catch (_) {}
    try { cm.setParameterValueById('ParamBodyAngleX', _curX * 12); } catch (_) {}
  }

  function _stopReaction() {
    const dying = _rx;
    _rx = null;

    // 把反应碰过的参数写回默认值，否则会卡在最后一帧的样子
    if (dying) {
      const cmx = im.coreModel;
      for (const pid in dying.def.tracks) {
        try {
          const idx = cmx.getParameterIndex(pid);
          if (typeof idx === 'number' && idx >= 0) {
            cmx.setParameterValueById(pid, cmx.getParameterDefaultValue(idx));
          }
        } catch (_) {}
      }
    }

    if (_blinkBefore !== '__none__') {
      im.eyeBlink = _blinkBefore;
      _blinkBefore = '__none__';
    }
    if (_physicsBefore !== '__none__') {
      im.physics = _physicsBefore;
      _physicsBefore = '__none__';
    }
    // 把待机动作接回去
    if (_resumeMotion) {
      const g = _resumeMotion;
      _resumeMotion = null;
      try { model.motion(g, 0, 3); } catch (_) {}
    }
  }

  // 松手时的收尾：不硬切回待机（会闪一下），用一条很短的时间轴把当前值淡回 0。
  // 必须在 _rx 还在的时候调用，才能读到"反应碰过哪些参数"。
  function _fadeOut(ms) {
    if (!_rx) return;
    const dur = Math.max(80, Number(ms) || 260);
    const cm = im.coreModel;
    const tracks = {};
    for (const pid in _rx.def.tracks) {
      let cur = 0;
      try {
        const idx = cm.getParameterIndex(pid);
        if (typeof idx === 'number' && idx >= 0) {
          cur = Number(cm.getParameterValueById(pid)) || 0;
        }
      } catch (_) {}
      tracks[pid] = [[0, cur], [dur, 0]];
    }
    _rx = { def: { duration: dur, tracks }, start: performance.now(), name: 'fade' };
  }

  function _tickReaction(now) {
    if (!_rx) return;

    // 循环：到点了就把起点往后推，接着播（首尾值相等，所以看不出接缝）
    let t = now - _rx.start;
    if (t >= _rx.def.duration) {
      if (_rx.def.loop) {
        _rx.start += _rx.def.duration;
        t = now - _rx.start;
        if (t < 0) t = 0;
      } else {
        _stopReaction();
        return;
      }
    }

    const cm = im.coreModel;
    const tracks = _rx.def.tracks;
    for (const pid in tracks) {
      try { cm.setParameterValueById(pid, _sample(tracks[pid], t)); } catch (_) {}
    }
  }

  function react(name) {
    const def = REACTIONS[name];
    if (!def) return false;

    // 反应期间暂停自动眨眼，否则会和闭眼 / 眯眼打架
    if (_blinkBefore === '__none__') {
      _blinkBefore = im.eyeBlink ?? null;
      im.eyeBlink = null;
    }

    // ★ 关键：大肥鱼这类模型的物理把 ParamEyeLOpen 等表情参数当成 OUTPUT，
    //   每帧重算并覆盖我们写的值（实测：物理开着时写 0，眼睛纹丝不动）。
    //   所以反应期间临时摘掉物理，播完立刻装回去。
    if (_physicsBefore === '__none__') {
      _physicsBefore = im.physics ?? null;
      im.physics = null;
    }

    // ★ 同样地，正在播放的动作（待机 Idle）每帧也在写全参数，
    //   不掐掉的话反应值会被它覆盖。
    const mm0 = im.motionManager;
    if (mm0 && typeof mm0.stopAllMotions === 'function') {
      if (!_resumeMotion) {
        _resumeMotion = (groups && groups.length) ? groups[0].name : 'Idle';
      }
      try { mm0.stopAllMotions(); } catch (_) {}
    }

    _rx = { def, start: performance.now(), name };
    return true;
  }

  // -------------------------------------------------------------------------
  // 部件显隐
  //   每个 drawable 都归属某个 Part（drawables.parentPartIndices）。想隐藏一个
  //   部件，只能把它的 drawable 的 opacities 抹 0 —— 改 part 自己的 opacity 没用，
  //   渲染器读的是 drawable 那一层（和上面黑层的毛病是同一个）。
  // -------------------------------------------------------------------------
  const _partDrawables = new Map();   // partIndex -> [drawableIndex...]
  const _partHidden = new Set();      // 当前隐藏的 partIndex

  function _indexPartDrawables() {
    _partDrawables.clear();
    const dr = im.coreModel && im.coreModel._model && im.coreModel._model.drawables;
    if (!dr || !dr.parentPartIndices) return false;
    const n = dr.parentPartIndices.length;
    for (let i = 0; i < n; i++) {
      const p = dr.parentPartIndices[i];
      if (!_partDrawables.has(p)) _partDrawables.set(p, []);
      _partDrawables.get(p).push(i);
    }
    return true;
  }

  function partList() {
    const parts = im.coreModel && im.coreModel._model && im.coreModel._model.parts;
    const ids = (parts && parts.ids) || [];
    if (!_partDrawables.size) _indexPartDrawables();
    const out = [];
    for (let i = 0; i < ids.length; i++) {
      const list = _partDrawables.get(i) || [];
      // 没有 drawable 的部件（纯逻辑分组）不列出来，UI 上勾了也没效果
      if (!list.length) continue;
      out.push({ index: i, id: String(ids[i]), drawables: list.length, hidden: _partHidden.has(i) });
    }
    return out;
  }

  function setPartHidden(index, on) {
    const i = Number(index);
    if (!Number.isInteger(i) || i < 0) return false;
    if (on) _partHidden.add(i);
    else _partHidden.delete(i);
    return true;
  }

  // -------------------------------------------------------------------------
  // 默认服装：把多个「换装表情」合并成一组参数
  //   cubism4 的 ExpressionManager 只有一个 currentExpression 槽位
  //   （setExpression → _setExpression(e)，后一个直接把前一个顶掉），
  //   所以「胸口衣服 + 裙子切换」不能连续调两次 expression()：
  //   后一次把前一次抹了，只有最后一个生效 —— 之前长裙生效、胸口没生效
  //   就是这个原因。这里改成把各表情的参数并成一份，每帧自己写一遍。
  // -------------------------------------------------------------------------
  const _costume = {};        // paramId -> { value, blend }
  let _costumeLog = [];       // 排查用：每个名字的处理结果

  function _applyCostume() {
    const cm = im && im.coreModel;
    if (!cm) return;
    for (const id in _costume) {
      const p = _costume[id];
      try {
        const idx = cm.getParameterIndex(id);
        if (typeof idx !== 'number' || idx < 0) continue;
        // 都以「参数默认值」为底算，不能叠上一帧的值（会一路涨上去）
        const base = cm.getParameterDefaultValue(idx);
        if (p.blend === 'Add') {
          cm.setParameterValueById(id, base + p.value);
        } else if (p.blend === 'Multiply') {
          cm.setParameterValueById(id, base * p.value);
        } else {
          cm.setParameterValueById(id, p.value);
        }
      } catch (_) {}
    }
  }

  // -------------------------------------------------------------------------
  // 统一挂到 Core 的 update 上
  //   参数 → 必须在 update 之前写
  //   黑层 → 必须在 update 之后抹（Core 每帧重算 opacities）
  // -------------------------------------------------------------------------
  (function installCoreHooks() {
    const cm = im.coreModel;

    // 先算出本模型要藏的画黑层
    const hidden = [];
    (function resolveHidden() {
      const base = modelName.replace(/\.model3\.json$/i, '').replace(/\.demo$/i, '');
      const idxs = HIDDEN_DRAWABLES_BY_MODEL[base];
      if (!idxs || !idxs.length) return;
      const dr = cm._model && cm._model.drawables;
      if (!dr || !dr.opacities) return;
      hidden.push(...idxs);
      for (let i = 0; i < hidden.length; i++) {
        try { dr.opacities[hidden[i]] = 0; } catch (_) {}
      }
      window.__l2dHiddenDrawables = hidden;
      console.warn('[fix] 已隐藏画黑层 drawable:', hidden.join(', '));
    })();

    const orig = cm.update.bind(cm);
    cm.update = function () {
      const out = orig.apply(cm, arguments);
      // 黑层必须在 update 之后抹（Core 每帧重算 opacities）
      const dr = cm._model && cm._model.drawables;
      if (dr && dr.opacities) {
        for (let i = 0; i < hidden.length; i++) {
          try { dr.opacities[hidden[i]] = 0; } catch (_) {}
        }
        // 被隐藏的部件同理：它下面的 drawable 每帧都会被重算，得跟着抹
        if (_partHidden.size) {
          for (const p of _partHidden) {
            const list = _partDrawables.get(p);
            if (!list) continue;
            for (let k = 0; k < list.length; k++) {
              try { dr.opacities[list[k]] = 0; } catch (_) {}
            }
          }
        }
      }
      return out;
    };

    // 参数写入：包住 internalModel.update 整个函数，在它进入之前写。
    // 试过的位置都不行 —— beforeModelUpdate 事件太晚（Core 会重置），
    // cm.update 里也太晚。实测只有"update 之前写"能保持住。
    if (typeof im.update === 'function') {
      const origIMUpdate = im.update.bind(im);
      im.update = function () {
        // 默认服装（换装开关）每帧都要重新写，和鼠标跟随同一个道理
        _applyCostume();
        // 反应优先；没有反应时才做鼠标跟随（否则会抢反应里的头角度）
        if (_rx) _tickReaction(performance.now());
        else _tickFollow();
        return origIMUpdate.apply(im, arguments);
      };
    }
  })();

  // 点击 / 摸头的判定：只看按住时长，不再看点在模型的哪个位置。
  //   < HOLD_MS 就松手  → tap         被戳一下
  //   >= HOLD_MS 还按着 → headpatLoop 摸头（按住期间一直摸，松手淡出）
  // HOLD_MS 可用 URL 参数 hold= 覆盖（毫秒），默认 300。
  const HOLD_MS = (() => {
    const v = parseFloat(new URLSearchParams(location.search).get('hold'));
    return Number.isFinite(v) && v > 0 ? v : 300;
  })();

  // 供 window.l2d.input 读取（也方便外部程序判断现在是什么手势状态）
  let _pressed = false;
  let _patting = false;
  let _holdTimer = 0;

  (function installPointer() {
    const host = app.renderer.view;
    if (!host) return;

    function endPress() {
      if (!_pressed) return;
      const wasPatting = _patting;
      _pressed = false;
      _patting = false;
      if (_holdTimer) { clearTimeout(_holdTimer); _holdTimer = 0; }
      if (wasPatting) _fadeOut(280);   // 摸完了松手：淡出回待机，不硬切
      else react('tap');               // 0.3 秒内撒手 = 点击
    }

    host.addEventListener('pointerdown', (ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;   // 只认左键
      if (_pressed) return;            // 重复按下（多指 / 漏了抬起）算同一次
      _pressed = true;
      _patting = false;
      _holdTimer = setTimeout(() => {
        _holdTimer = 0;
        if (!_pressed) return;
        _patting = true;
        react('headpatLoop');
      }, HOLD_MS);
    });

    // 抬起可能发生在画布外面（按住拖出去再松手），所以挂在 window 上
    window.addEventListener('pointerup', endPress);
    window.addEventListener('pointercancel', endPress);
    // 窗口失焦（比如 Alt+Tab 切走）时松开按住状态，别卡在摸头
    window.addEventListener('blur', endPress);
  })();

  // 原始自动行为实例，用于开关后还原
  const saved = {
    eyeBlink: im.eyeBlink ?? null,
    breath:   im.breath   ?? null,
    physics:  im.physics  ?? null,
  };

  // --- 从运行时的模型里读出动作组与表情名 -------------------------------
  const motionDefs = (mm && mm.definitions) || {};
  const groups = Object.keys(motionDefs).map((k) => ({
    name: k,
    count: Array.isArray(motionDefs[k]) ? motionDefs[k].length : 0,
  }));

  const em = mm && mm.expressionManager ? mm.expressionManager : null;
  const exprDefs = (em && em.definitions) || [];
  const expressions = exprDefs
    .map((d) => d && (d.Name || d.name || d.Id || d.id))
    .filter((s) => typeof s === 'string' && s.length);

  // 表达式里的参数。注意 loadExpression() 返回的是 CubismExpressionMotion
  // 实例（不是 exp3.json 的原始对象），参数在 _parameters 里，形如
  //   [{ parameterId: 'Clothes3', blendType: 0, value: 1 }]
  // blendType：0=Add 1=Multiply 2=Overwrite（Cubism 的枚举）
  // 原始 JSON 的写法（{Id,Value,Blend}）也兼容，换别的库时不至于炸。
  function _exprParams(def) {
    if (!def) return [];
    const raw = def._parameters || def.parameters || def.Parameters || [];
    const out = [];
    for (let i = 0; i < raw.length; i++) {
      const p = raw[i] || {};
      const id = p.parameterId || p.id || p.Id;
      if (typeof id !== 'string' || !id) continue;
      let blend = p.blendType ?? p.blend ?? p.Blend ?? 0;
      if (typeof blend === 'number') {
        blend = blend === 1 ? 'Multiply' : blend === 2 ? 'Overwrite' : 'Add';
      }
      out.push({
        id,
        value: Number(p.value ?? p.Value ?? 0) || 0,
        blend: String(blend),
      });
    }
    return out;
  }

  function _findExprIndex(name) {
    for (let i = 0; i < exprDefs.length; i++) {
      const d = exprDefs[i] || {};
      if ((d.Name || d.name || d.Id || d.id) === name) return i;
    }
    return -1;
  }

  // 把多个表情的参数并成一份，交给 _applyCostume() 每帧写。
  // 单槽的表情管理器只能留一个，所以合并必须自己做（见 _costume 顶部注释）。
  async function applyExpressions(names) {
    const list = (Array.isArray(names) ? names : [names])
      .map((n) => (typeof n === 'string' ? n.trim() : ''))
      .filter((n) => n.length);
    const merged = {};
    const applied = [];
    _costumeLog = ['em=' + (em ? 'ok' : 'null') + ' defs=' + exprDefs.length];
    if (em) {
      for (const name of list) {
        const idx = _findExprIndex(name);
        if (idx < 0) { _costumeLog.push(name + ': 找不到'); continue; }
        let def = null;
        try {
          def = typeof em.loadExpression === 'function'
            ? await em.loadExpression(idx)
            : await em.getExpression(idx);
        } catch (e) {
          _costumeLog.push(name + ': 加载失败 ' + ((e && e.message) || e));
          continue;
        }
        if (!def) { _costumeLog.push(name + ': 定义为空'); continue; }
        const ps = _exprParams(def);
        if (!ps.length) {
          let dump = '';
          try { dump = JSON.stringify(def._parameters || null); } catch (_) { dump = '?'; }
          _costumeLog.push(name + ': 无参数 keys=' + Object.keys(def).join('|') + ' params=' + dump);
          continue;
        }
        for (const p of ps) merged[p.id] = p;
        applied.push(name);
        _costumeLog.push(name + ': ' + ps.map((p) => p.id + '=' + p.value).join(','));
      }
    }
    // 上一批有、这一批没有的参数：写回默认值。Cubism 会保留上一帧的外部写入，
    // 不主动清掉的话「撤掉换装」之后衣服还停在合着的样子。
    for (const id in _costume) {
      if (id in merged) continue;
      try {
        const cm = im && im.coreModel;
        const idx = cm && cm.getParameterIndex(id);
        if (cm && typeof idx === 'number' && idx >= 0) {
          cm.setParameterValueById(id, cm.getParameterDefaultValue(idx));
        }
      } catch (_) {}
    }
    for (const k in _costume) delete _costume[k];
    for (const k in merged) _costume[k] = merged[k];
    // 单槽里若还挂着一个表情，它会和这里抢同一批参数，清掉
    try { em && em.resetExpression(); } catch (_) {}
    _applyCostume();
    _costumeLog.push('merged=' + Object.keys(merged).join(','));
    return { applied, params: Object.keys(merged) };
  }

  // --- 布局 -------------------------------------------------------------
  // 注意：不能用 app.renderer.width/resolution 当视口尺寸。QWebEngineView 里
  // 窗口最大化/全屏时 pixi 的 renderer 未必立刻跟上，而 resized 之后 fit 又不再
  // 触发，结果就是模型停在按旧尺寸算出的位置（偏左上、不再放大）。
  // 直接读 canvas 的 CSS 尺寸，最贴合真实可视区域。
  let fitScale = 1;
  let userScale = 1;
  let followOn = true;

  // 取景模式（由宿主用 URL 参数指定，默认 'full' 保持原行为）：
  //   full —— 全身适应，整只模型塞进视口
  //   bust —— 上半身特写：宽度铺满、头顶留一点空隙，多出来的身高从下方裁掉
  //   zoom —— bust 下的额外放大倍数；top —— 头顶留白（占视口高度的比例）
  const FRAMING = (() => {
    const qs = new URLSearchParams(location.search);
    const mode = qs.get('framing') === 'bust' ? 'bust' : 'full';
    const zoom = parseFloat(qs.get('zoom')) || 1.0;
    const top = parseFloat(qs.get('top'));
    return { mode, zoom, top: Number.isFinite(top) ? top : 0.02 };
  })();

  // 额外偏移（像素）。宿主侧用 l2d.offset() 调，用来微调模型在框里的位置。
  const OFFSET = { x: 0, y: 0 };

  function viewport() {
    const cv = app.view;
    const vw = (cv && cv.clientWidth) || window.innerWidth || 1;
    const vh = (cv && cv.clientHeight) || window.innerHeight || 1;
    return [vw, vh];
  }

  function fit() {
    const [vw, vh] = viewport();
    const w = im.width || 1;
    const h = im.height || 1;

    if (FRAMING.mode === 'bust') {
      // 宽度铺满：保证肩膀和手臂不被裁掉；头顶对齐后，超出的身高自然裁在下方
      fitScale = (vw / w) * FRAMING.zoom;
      applyScale();
      model.anchor.set(0.5, 0);
      model.position.set(vw / 2 + OFFSET.x, vh * FRAMING.top + OFFSET.y);
      return;
    }

    fitScale = Math.min(vw / w, vh / h) * 0.94;
    applyScale();
    model.anchor.set(0.5, 0.5);
    model.position.set(vw / 2 + OFFSET.x, vh / 2 + OFFSET.y);
  }

  function applyScale() {
    model.scale.set(fitScale * userScale);
  }

  fit();

  // resize 之后 pixi 的 renderer 可能晚一帧才更新，所以延迟再算一次
  let fitTimer = 0;
  function scheduleFit() {
    fit();
    if (fitTimer) clearTimeout(fitTimer);
    fitTimer = setTimeout(fit, 60);
  }
  window.addEventListener('resize', scheduleFit);
  document.addEventListener('fullscreenchange', scheduleFit);
  // ResizeObserver 同时盯着 canvas 自身，任何 CSS 尺寸变化都能兜住
  try {
    new ResizeObserver(scheduleFit).observe(app.view);
  } catch (_) {
    new ResizeObserver(scheduleFit).observe(document.body);
  }

  // --- 调试读数（左上角） -------------------------------------------------
  // 排查"跟随不生效"用：能直接看到 Qt 推过来的 aim 和实际写进模型的角度。
  // 不需要时把 DEBUG_HUD 改成 false。
  const DEBUG_HUD = true;
  if (DEBUG_HUD) {
    const hud = document.createElement('div');
    hud.style.cssText = 'position:fixed;left:10px;top:10px;z-index:9999;' +
      'pointer-events:none;font:13px/1.5 Consolas,monospace;color:#7ec8ff;' +
      'background:rgba(10,14,20,.72);padding:8px 12px;border-radius:6px;' +
      'border:1px solid #2a3a4a;white-space:pre';
    document.body.appendChild(hud);
    setInterval(() => {
      let ax = 0, ay = 0;
      try {
        const c = im.coreModel;
        ax = Number(c.getParameterValueById('ParamAngleX')) || 0;
        ay = Number(c.getParameterValueById('ParamAngleY')) || 0;
      } catch (_) {}
      hud.textContent =
        `aim  ${_aimX.toFixed(2)}, ${_aimY.toFixed(2)}\n` +
        `平滑 ${_curX.toFixed(2)}, ${_curY.toFixed(2)}\n` +
        `角度 ${ax.toFixed(1)}, ${ay.toFixed(1)}`;
    }, 150);
  }

  // --- 视线跟随 ---------------------------------------------------------
  // 只记录鼠标的归一化位置，真正的参数写入在 _tickFollow() 里（每帧一次）。
  // 原来的 model.focus() 在这个配置下不工作（实测一个参数都改不动）。
  document.addEventListener('mousemove', (e) => {
    if (!followOn) return;
    const r = app.view.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    _aimX = Math.max(-1, Math.min(1, nx));
    _aimY = Math.max(-1, Math.min(1, ny));
  });

  // -----------------------------------------------------------------------
  // 对外 API —— 与 demo_probe.html 保持同一套方法名与签名
  // -----------------------------------------------------------------------
  window.l2d = {
    probe: false,
    app,
    model,
    groups,
    expressions,

    // 触发反应动作：'tap'（被戳）| 'headpat'（被摸头）| 'headpatLoop'（循环摸头）
    // 给外部（PyQt 端 / 用户软件）调用，返回 true 表示已开始播放
    react,
    // 停止当前反应（循环版必须靠它停）
    stopReaction() { _stopReaction(); return true; },
    // 当前是否正在播反应
    get reacting() { return !!_rx; },
    // 正在播的反应名：'tap' | 'headpat' | 'headpatLoop' | 'fade'，空闲为 null
    get reaction() { return _rx ? _rx.name || null : null; },
    // 指针按住状态与判定阈值（调试 / 自动化测试用）
    get input() { return { pressed: _pressed, patting: _patting, holdMs: HOLD_MS }; },
    reactions: Object.keys(REACTIONS),

    motion(group, index = 0) {
      try { model.motion(group, index); return true; }
      catch (e) { fail(e.message); return false; }
    },
    randomMotion() {
      try { model.motion(); return true; }
      catch (e) { fail(e.message); return false; }
    },
    expression(name) {
      try { model.expression(name); return true; }
      catch (e) { fail(e.message); return false; }
    },
    randomExpression() {
      try { model.expression(); return true; }
      catch (e) { fail(e.message); return false; }
    },
    resetExpression() {
      try {
        // 合并出来的默认服装也一并撤掉（applyExpressions 会把参数写回默认值），
        // 否则「重置表情」之后衣服还合着
        applyExpressions([]);
        em && em.resetExpression && em.resetExpression();
        return true;
      }
      catch (e) { fail(e.message); return false; }
    },
    // 同时套多个表情（换装开关），参数会合并；单槽管理器做不到这件事。
    // 两种调用都吃：setExpressions(['a','b']) / setExpressions('a','b')
    setExpressions(...names) {
      const list = names.length === 1 && Array.isArray(names[0]) ? names[0] : names;
      applyExpressions(list);
      return true;
    },
    // 当前生效的合并参数，形如 ["Clothes3=1", "Clothes1=-1"]
    get costume() {
      return Object.keys(_costume).map((id) => id + '=' + _costume[id].value);
    },
    // 排查用：最近一次 setExpressions 的处理过程
    get costumeLog() { return _costumeLog.slice(); },

    set(id, v) {
      try { im.coreModel.setParameterValueById(id, Number(v)); return true; }
      catch (e) { fail(e.message); return false; }
    },
    get(id) {
      try { return im.coreModel.getParameterValueById(id); }
      catch (e) { return null; }
    },

    autoBlink(on) {
      im.eyeBlink = on ? saved.eyeBlink : null;
      return !!im.eyeBlink;
    },
    autoBreath(on) {
      im.breath = on ? saved.breath : null;
      return !!im.breath;
    },
    physics(on) {
      // ⚠ 跟随期间物理是被临时摘掉的（见 _tickFollow 的注释：物理开着会把
      // ParamAngleX 锁死，画面只剩眼珠在动）。这时候宿主来设物理，只记配置，
      // 绝对不要把物理塞回去 —— 之前就是这么塞回去的，头就再也不转了。
      _physWanted = !!on;
      if (_physSuspended) return !!(_physWanted && _physSaved);
      im.physics = on ? saved.physics : null;
      return !!im.physics;
    },

    scale(k) {
      userScale = Math.max(0.2, Math.min(4, Number(k) || 1));
      applyScale();
      return userScale;
    },
    // 额外偏移（像素），正数往右下
    offset(dx, dy) {
      OFFSET.x = Number(dx) || 0;
      OFFSET.y = Number(dy) || 0;
      fit();
      return { x: OFFSET.x, y: OFFSET.y };
    },
    // 取景：full（全身适应）/ bust（上半身）
    framing(mode, zoom, top) {
      if (mode === 'full' || mode === 'bust') FRAMING.mode = mode;
      if (Number.isFinite(Number(zoom)) && Number(zoom) > 0) FRAMING.zoom = Number(zoom);
      if (Number.isFinite(Number(top))) FRAMING.top = Math.max(0, Math.min(0.5, Number(top)));
      fit();
      return { mode: FRAMING.mode, zoom: FRAMING.zoom, top: FRAMING.top };
    },
    get framingInfo() { return { mode: FRAMING.mode, zoom: FRAMING.zoom, top: FRAMING.top, offset: { x: OFFSET.x, y: OFFSET.y } }; },

    // 部件显隐：parts() 列出「有 drawable 的」部件，setPart 勾隐藏
    parts() { return partList(); },
    setPart(index, hidden) {
      if (!setPartHidden(index, !!hidden)) return false;
      return { index: Number(index), hidden: !!hidden };
    },
    follow(on) { followOn = !!on; return followOn; },
    focus(x, y) {
      try { model.focus(x, y); return true; } catch (e) { return false; }
    },
    focusAt(x, y) { return this.focus(x, y); },

    // 外部直接推鼠标位置（归一化 -1~1）。
    // Qt 那边用轮询喂进来，比依赖 mousemove 事件可靠：
    // QWebEngineView 不一定会把鼠标事件转发到页面里。
    setAim(nx, ny) {
      _aimX = Math.max(-1, Math.min(1, Number(nx) || 0));
      _aimY = Math.max(-1, Math.min(1, Number(ny) || 0));
      return true;
    },
    get aim() { return { x: _aimX, y: _aimY, cx: _curX, cy: _curY, follow: followOn }; },

    snapshot() {
      // 优先用 pixi 的 extract（不受 WebGL drawingBuffer 被清空的影响）
      try {
        const url = app.renderer.extract.base64(app.stage);
        if (typeof url === 'string' && url.startsWith('data:')) return url;
      } catch (_) {}
      try { return app.view.toDataURL('image/png'); }
      catch (e) { fail('截图失败: ' + e.message); return null; }
    },

    info() {
      return {
        mode: 'live2d',
        groups,
        expressions,
        size: [im.width, im.height],
        hasPhysics: !!saved.physics,
        hasEyeBlink: !!saved.eyeBlink,
        hasBreath: !!saved.breath,
      };
    },
  };

  window.l2dReady = true;
  window.l2dInfo = window.l2d.info();
} catch (e) {
  fail((e && e.message) || e);
}
})();
</script>
</body>
</html>
